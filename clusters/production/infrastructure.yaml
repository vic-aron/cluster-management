apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-ovn-v2
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: ExternalArtifact
    name: infrastructure
  path: "./infrastructure/kube-ovn-v2"
  prune: false
  timeout: 3m
---
