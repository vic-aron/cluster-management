apiVersion: source.extensions.fluxcd.io/v1beta1
kind: ArtifactGenerator
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  sources:
    - alias: repo
      kind: GitRepository
      name: cluster-management
  artifacts:
    - name: infrastructure
      copy:
        - from: "@repo/infrastructure/**"
          to: "@artifact/infrastructure/"
---
