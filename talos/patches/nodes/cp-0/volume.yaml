apiVersion: v1alpha1
kind: VolumeConfig
name: STATE
encryption:
  provider: luks2
  keys:
    - tpm:
        options:
          pcrs: [7]
      slot: 0
    - nodeID: {}
      slot: 1
---
apiVersion: v1alpha1
kind: VolumeConfig
name: EPHEMERAL
mount:
  secure: true
encryption:
  provider: luks2
  keys:
    - tpm:
        options:
          pcrs: [7]
      slot: 0
      lockToState: true
    - nodeID: {}
      slot: 1
      lockToState: true
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: cdi-scratch
volumeType: directory
---
apiVersion: v1alpha1
kind: UserVolumeConfig
name: openebs
volumeType: directory
---
apiVersion: v1alpha1
kind: FilesystemTrimConfig
interval: 168h0m0s
---
apiVersion: v1alpha1
kind: FilesystemScrubConfig
interval: 168h0m0s
