apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs-zfslocalpv
  namespace: flux-system
spec:
  interval: 15m
  timeout: 5m
  chart:
    spec:
      chart: zfs-localpv
      version: "2.11.x"
      sourceRef:
        kind: HelmRepository
        name: openebs-zfslocalpv
        namespace: flux-system
  releaseName: zfs-localpv
  targetNamespace: openebs
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  test:
    enable: true
  driftDetection:
    mode: enabled
  valuesFrom:
    - kind: ConfigMap
      name: zfs-localpv-values
      valuesKey: values.yaml
      optional: false
