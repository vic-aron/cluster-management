apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-zfspv-retain-128k
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  recordsize: "128k"
  compression: "zstd"
  dedup: "off"
  fstype: "zfs"
  poolname: "zfspv-pool"
  atime: "off"
  thinProvision: "yes"
  logbias: "throughput"
  quotatype: "refquota"
provisioner: zfs.csi.openebs.io
volumeBindingMode: WaitForFirstConsumer
---
