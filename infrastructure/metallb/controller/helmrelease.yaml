apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 12h
  chart:
    spec:
      chart: metallb
      version: "0.16.x"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  releaseName: metallb
  targetNamespace: metallb-system
  valuesFrom:
    - kind: ConfigMap
      name: metallb-values
      valuesKey: values.yaml
      optional: false
  install:
    timeout: 5m
    crds: Create
    createNamespace: true
  upgrade:
    timeout: 5m
    crds: Create
  driftDetection:
    mode: enabled
