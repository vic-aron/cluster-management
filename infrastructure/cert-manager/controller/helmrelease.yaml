apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: cert-manager
    namespace: flux-system
  releaseName: cert-manager
  targetNamespace: cert-manager
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values
      valuesKey: values.yaml
      optional: false
  install:
    timeout: 5m
    crds: Create
    createNamespace: true
    strategy:
      name: RemediateOnFailure
      retryInterval: 3m
    remediation:
      retries: 3
      ignoreTestFailures: false
      remediateLastFailure: true
  upgrade:
    timeout: 5m
    crds: Create
    cleanupOnFail: false
    strategy:
      name: RemediateOnFailure
      retryInterval: 3m
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  test:
    enable: true
    ignoreFailures: false
  rollback:
    timeout: 5m
    cleanupOnFail: false
  uninstall:
    timeout: 5m
  driftDetection:
    mode: enabled

