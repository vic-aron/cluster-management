apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#namespace: kube-system
labels:
  - pairs:
      app.kubernetes.io/name: metrics-server
      app.kubernetes.io/component: metrics
      app.kubernetes.io/part-of: infrastructure
      app.kubernetes.io/managed-by: flux
      platform.shinoval.work/cluster-role: management
      platform.shinoval.work/cluster-name: cluster-management
      platform.shinoval.work/cluster-environment: production
      platform.shinoval.work/owner: vic-aron
      platform.shinoval.work/team: platform
      platform.example.com/lifecycle: permanent
    includeSelectors: false
    includeTemplates: false
resources:
  - helmrepository.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: vpa-values
    namespace: flux-system
    files:
      - values.yaml

