apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cluster-autoscaler
  namespace: flux-system
spec:
  interval: 12h
  chart:
    spec:
      chart: cluster-autoscaler
      version: "9.59.x"
      sourceRef:
        kind: HelmRepository
        name: cluster-autoscaler
        namespace: flux-system
  releaseName: cluster-autoscaler
  targetNamespace: kube-system
  valuesFrom:
    - kind: ConfigMap
      name: cluster-autoscaler-values
      valuesKey: values.yaml
      optional: false
  install:
    timeout: 5m
    crds: Create
    createNamespace: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      ignoreTestFailures: false
      remediateLastFailure: true
  upgrade:
    timeout: 5m
    crds: Create
    cleanupOnFail: false
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  test:
    enable: true
    ignoreFailures: false
  rollback:
    timeout: 5m
    cleanupOnFail: false
  uninstall:
    timeout: 5m
  driftDetection:
    mode: enabled
