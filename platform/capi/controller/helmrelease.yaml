apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: capi-operator
      version: "1.14.2"
      sourceRef:
        kind: HelmRepository
        name: capi-operator
        namespace: flux-system
  releaseName: capi-operator
  targetNamespace: capi-operator-system
  install:
    timeout: 5m
    crds: Create
    createNamespace: true
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      ignoreTestFailures: false
      remediateLastFailure: true
  upgrade:
    timeout: 5m
    crds: Create
    cleanupOnFail: false
    strategy:
      name: RemediateOnFailure
    remediation:
      retries: 3
      strategy: rollback
      remediateLastFailure: true
  test:
    enable: true
    ignoreFailures: false
  rollback:
    timeout: 5m
    cleanupOnFail: false
  uninstall:
    timeout: 5m
  driftDetection:
    mode: enabled
